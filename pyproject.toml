["project"]
"name" = "infrastructure"
"dynamic" = ["version"]
"description" = "Versioned declarative configuration for portable infrastructure"
"readme" = "README.md"
"requires-python" = ">=3.13"
"dependencies" = []

["dependency-groups"]
"dev" = ["ansible>=12.0.0", "ansible-lint>=25.0.0", "dagster==1.13.16", "dagster-postgres==0.29.16", "jsonschema>=4.0.0", "pre-commit>=4.0.0", "python-semantic-release>=10.0.0", "sqlalchemy==2.0.52", "yamllint>=1.35.0"]

["tool"]

["tool"."uv"]
"package" = false

["tool"."wood"]

["tool"."wood"."verify"]
"version" = 1
"retry_safe" = true
"checks" = [{ "name" = "weekly-local-recovery", "argv" = ["uv", "run", "--frozen", "scripts/weekly_recovery.py", "--deadline-seconds", "40"], "required" = true, "timeout_seconds" = 60 }]

["tool"."wood"."architecture"]
"domain" = "infrastructure"
"capability" = "hosting-deployment"
"kind" = "infrastructure-configuration"

["tool"."wood"."openproject"]
"project_id" = 3
"initiative_id" = 552

["tool"."wood"."branching"]
"strategy" = "integration"
"release_id" = 26
"integration_branch" = "development"
"scope_reference" = "https://projects.woodhost.cloud/work_packages/558 activity 1481; canonical fleet migration authorized 2026-10-15; protected-main merges remain separately approved."

["tool"."setuptools"]
"packages" = []

["tool"."semantic_release"]
"commit_parser" = "conventional"
"commit_message" = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
"allow_zero_version" = true
"major_on_zero" = false
"tag_format" = "v{version}"

["tool"."semantic_release"."commit_parser_options"]
"minor_tags" = ["feat"]
"patch_tags" = ["fix", "perf"]
"parse_squash_commits" = true
"ignore_merge_commits" = true

["tool"."semantic_release"."changelog"]
"exclude_commit_patterns" = ["chore(?:\\([^)]*?\\))?: .+", "ci(?:\\([^)]*?\\))?: .+", "docs(?:\\([^)]*?\\))?: .+", "refactor(?:\\([^)]*?\\))?: .+", "style(?:\\([^)]*?\\))?: .+", "test(?:\\([^)]*?\\))?: .+", "chore\\(release\\): .+"]

["tool"."semantic_release"."remote"]
"type" = "github"

["tool"."semantic_release"."remote"."token"]
"env" = "GITHUB_TOKEN"

["tool"."semantic_release"."publish"]
"upload_to_vcs_release" = true
