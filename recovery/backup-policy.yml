---
consumer: infrastructure
environment: dev
postgres_container: infrastructure-dev-postgres-postgres-1
max_age_seconds: 86400
pointer: /mnt/wood-server-nas/backup_server/swood-server/infrastructure-dev/current.json
required_sources:
  - postgres-globals
  - dagster
  - openwebui
  - keycloak
  - infisical
  - portfolio_website
  - synthetic_website_data
  - rag_service
  - events_service
  - architecture_docs
  - dagster-state
  - openwebui-files
  - rag-documents
  - overleaf-files
  - infisical-recovery-keys
  - overleaf-mongo
  - infisical-redis
  - overleaf-redis
restore_database: dagster
restore_file_source: rag-documents
representative_queries:
  - SELECT count(*)>0 FROM information_schema.tables WHERE table_schema='public';
  - SELECT count(*)>=0 FROM runs;
schema_version: 1
