---
name: Deploy released Events Service pin
'on':
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.scope.outputs.approved }}
      release_tag: ${{ steps.scope.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check exact published Events-only release scope
        id: scope
        env:
          RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: >-
          uv run --frozen python scripts/events_release_scope.py
          --revision "$RELEASE_REVISION" --github-output "$GITHUB_OUTPUT"
      - name: Verify published Infrastructure release authority
        if: steps.scope.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.scope.outputs.release_tag }}
        run: >-
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --json isDraft,isPrerelease --jq
          'if .isDraft or .isPrerelease then error("stable release required") else true end'
  deploy-events:
    needs: scope
    if: needs.scope.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the approved Events-only deployment interface
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.scope.outputs.release_tag }}
        run: >-
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
          --ref main --field deployment_approved=true
          --field release="$RELEASE_TAG" --field events_service_only=true
          --field skip_superseded=true
