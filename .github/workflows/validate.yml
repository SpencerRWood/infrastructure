---
name: Validate
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
  statuses: write
jobs:
  validation:
    uses: SpencerRWood/workflows/.github/workflows/validate.yml@4a3f40661622ae445d6ca231f31a1a6368e60ecf
    with:
      workflow_revision: 4a3f40661622ae445d6ca231f31a1a6368e60ecf
      publish_commit_status: >-
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository }}
      status_context: infrastructure-validation
    secrets:
      dbt_host: ${{ secrets.DBT_HOST }}
      dbt_user: ${{ secrets.DBT_USER }}
      dbt_password: ${{ secrets.DBT_PASSWORD }}
      dbt_port: ${{ secrets.DBT_PORT }}
      dbt_dbname: ${{ secrets.DBT_DBNAME }}
      dbt_schema: ${{ secrets.DBT_SCHEMA }}
