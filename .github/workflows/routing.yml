---
name: PR routing
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  routing:
    name: pr-routing
    runs-on: ubuntu-latest
    outputs:
      incident: ${{ steps.route.outputs.incident }}
      approval: ${{ steps.route.outputs.approval }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check out pinned shared routing helper
        uses: actions/checkout@v6
        with:
          repository: SpencerRWood/workflows
          ref: 4a3f40661622ae445d6ca231f31a1a6368e60ecf
          path: .wood-workflows
          persist-credentials: false
      - id: route
        name: Verify PR routing and ancestry
        run: >-
          python3 .wood-workflows/scripts/github_flow_routing.py
          --event-file "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"
