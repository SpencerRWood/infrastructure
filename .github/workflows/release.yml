---
name: Release
'on':
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm separate approval to publish this
          main revision.
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name
      == 'push' || (github.event_name == 'workflow_dispatch' &&
      inputs.release_approved == true))
    uses: SpencerRWood/workflows/.github/workflows/release.yml@9748b1cd6287d84d55c4277c93ca5dae01fb1787
    with:
      require_approval: ${{ github.event_name == 'workflow_dispatch'
        }}
      workflow_revision: 9748b1cd6287d84d55c4277c93ca5dae01fb1787
      approved: ${{ inputs.release_approved }}
