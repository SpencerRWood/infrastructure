---
name: Release
'on':
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm separate approval to publish this
          main revision.
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name
      == 'push' || (github.event_name == 'workflow_dispatch' &&
      inputs.release_approved == true))
    uses: SpencerRWood/workflows/.github/workflows/release.yml@613bb7d915cec854b5f7f2b5d26e963c8a4ada3f
    with:
      require_approval: ${{ github.event_name == 'workflow_dispatch'
        }}
      workflow_revision: 613bb7d915cec854b5f7f2b5d26e963c8a4ada3f
      approved: ${{ inputs.release_approved == true }}
