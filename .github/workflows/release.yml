---
name: Release

'on':
  push:
    branches:
      - main

permissions:
  contents: write
  deployments: write

jobs:
  release:
    uses: SpencerRWood/workflows/.github/workflows/release.yml@v1

  deploy-dev:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: ./.github/workflows/deploy-target.yml
    with:
      ref: ${{ needs.release.outputs.release_tag }}
      skip_superseded: true
