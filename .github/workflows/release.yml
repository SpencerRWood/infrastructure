---
name: Release

'on':
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm separate approval to publish this main revision.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_approved == true
    uses: SpencerRWood/workflows/.github/workflows/release.yml@9307f9b80141f4ed9c463af360a1b13a49ca3353
    with:
      require_approval: true
      workflow_revision: 9307f9b80141f4ed9c463af360a1b13a49ca3353
      approved: ${{ inputs.release_approved }}
