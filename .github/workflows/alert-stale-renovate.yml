---
name: Alert on stale Renovate automerge

'on':
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for stale eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/alert_stale_renovate_prs.py
