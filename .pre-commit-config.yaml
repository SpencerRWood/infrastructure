---
default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: backup-configuration
        name: Backup YAML schema and coverage policy
        entry: uv run python scripts/validate-backups.py environments/dev.yml
        language: system
        pass_filenames: false
        always_run: true
      - id: workflow-governance
        name: Publication and deployment workflow contracts
        entry: >-
          uv run python -m unittest discover
          -s tests -p test_workflow_governance.py
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|tests/test_workflow_governance\.py)
      - id: weekly-recovery-ansible
        name: Weekly recovery Ansible syntax and lint
        entry: >-
          sh -c 'ANSIBLE_CONFIG=recovery/ansible.cfg uv run ansible-playbook
          -i localhost, recovery/weekly.yml --syntax-check &&
          ANSIBLE_CONFIG=recovery/ansible.cfg uv run ansible-lint
          recovery/weekly.yml'
        language: system
        pass_filenames: false
        always_run: true
      - id: yamllint
        name: YAML lint
        entry: uv run yamllint .
        language: system
        pass_filenames: false
      - id: ansible-inventory
        name: Ansible inventory validation
        entry: >-
          sh -c 'ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-inventory
          -i ansible/inventory/dev --graph && ANSIBLE_CONFIG=ansible/ansible.cfg
          uv run ansible-inventory -i ansible/inventory/prod --graph'
        language: system
        pass_filenames: false
      - id: ansible-syntax
        name: Ansible playbook syntax
        entry: >-
          sh -c 'ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/dev.yml --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/prod ansible/playbooks/prod.yml --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/remove-homelab-overleaf.yml --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/dev-backups.yml --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/architecture-reader.yml
          -e infrastructure_environment=dev --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/postgres-tls.yml
          -e infrastructure_environment=dev --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/documentation-automation-db.yml
          -e infrastructure_environment=dev --syntax-check &&
          ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-playbook
          -i ansible/inventory/dev ansible/playbooks/codex-usage-coordination.yml
          -e infrastructure_environment=dev --syntax-check'
        language: system
        pass_filenames: false
      - id: ansible-lint
        name: Ansible lint
        entry: >-
          sh -c 'ANSIBLE_CONFIG=ansible/ansible.cfg uv run ansible-lint ansible'
        language: system
        pass_filenames: false
      - id: infrastructure-validation
        name: Infrastructure validation
        entry: bash scripts/validate.sh
        language: system
        pass_filenames: false
