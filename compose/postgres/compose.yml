name: ${POSTGRES_PROJECT_NAME:?POSTGRES_PROJECT_NAME is required}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=${POSTGRES_TLS_ENABLED:?POSTGRES_TLS_ENABLED is required}
      - -c
      - ssl_cert_file=/run/postgres-tls/current/server.crt
      - -c
      - ssl_key_file=/run/postgres-tls/current/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    ports:
      - "${POSTGRES_LAN_BIND:?POSTGRES_LAN_BIND is required}:${POSTGRES_LAN_PORT:?POSTGRES_LAN_PORT is required}:5432"
    networks:
      - postgres
      - lan
    secrets:
      - postgres_password
    volumes:
      - ${POSTGRES_DATA_PATH:?POSTGRES_DATA_PATH is required}:/var/lib/postgresql/data
      - type: bind
        source: ${POSTGRES_TLS_DIRECTORY:?POSTGRES_TLS_DIRECTORY is required}
        target: /run/postgres-tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}

networks:
  postgres:
    name: ${POSTGRES_NETWORK:?POSTGRES_NETWORK is required}
    internal: true
  lan:
    name: ${POSTGRES_LAN_NETWORK:?POSTGRES_LAN_NETWORK is required}
