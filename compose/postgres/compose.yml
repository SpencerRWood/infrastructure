name: ${POSTGRES_PROJECT_NAME:?POSTGRES_PROJECT_NAME is required}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    ports:
      - "${POSTGRES_LAN_BIND:?POSTGRES_LAN_BIND is required}:${POSTGRES_LAN_PORT:?POSTGRES_LAN_PORT is required}:5432"
    networks:
      - postgres
      - lan
    secrets:
      - postgres_password
    volumes:
      - ${POSTGRES_DATA_PATH:?POSTGRES_DATA_PATH is required}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}

networks:
  postgres:
    name: ${POSTGRES_NETWORK:?POSTGRES_NETWORK is required}
    internal: true
  lan:
    name: ${POSTGRES_LAN_NETWORK:?POSTGRES_LAN_NETWORK is required}
