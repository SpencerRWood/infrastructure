name: wood-infrastructure-postgres

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    container_name: wood-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    ports:
      - "${POSTGRES_BIND_ADDRESS:?POSTGRES_BIND_ADDRESS is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    networks:
      database-internal:
        aliases:
          - postgres
          - wood-data-postgres
      lan-access:
        aliases:
          - postgres
          - wood-data-postgres
    secrets:
      - postgres_password
    volumes:
      - ${POSTGRES_DATA_PATH:?POSTGRES_DATA_PATH is required}:/var/lib/postgresql/data
      - ${POSTGRES_INIT_PATH:?POSTGRES_INIT_PATH is required}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}

networks:
  database-internal:
    external: true
    name: ${POSTGRES_INTERNAL_NETWORK:?POSTGRES_INTERNAL_NETWORK is required}
  lan-access:
    external: true
    name: ${POSTGRES_LAN_NETWORK:?POSTGRES_LAN_NETWORK is required}
