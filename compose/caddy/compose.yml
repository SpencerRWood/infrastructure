---
name: ${CADDY_PROJECT_NAME:?CADDY_PROJECT_NAME is required}

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:e8d293dca35c033c4eb958d77b9096098e34da2987da3954acc0028267c6cc9b
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_BIND:?CADDY_HTTP_BIND is required}:80"
      - "${CADDY_HTTPS_BIND:?CADDY_HTTPS_BIND is required}:443"
    volumes:
      - ${CADDYFILE_PATH:?CADDYFILE_PATH is required}:/etc/caddy/Caddyfile:ro
      - ${CADDY_ROUTES_PATH:?CADDY_ROUTES_PATH is required}:/etc/caddy/routes:ro
      - ${CADDY_DATA_PATH:?CADDY_DATA_PATH is required}:/data
      - ${CADDY_CONFIG_PATH:?CADDY_CONFIG_PATH is required}:/config
    networks:
      - proxy

networks:
  proxy:
    name: ${CADDY_PROXY_NETWORK:?CADDY_PROXY_NETWORK is required}
