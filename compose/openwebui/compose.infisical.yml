---
name: ${OPENWEBUI_PROJECT_NAME:?required}

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_IMAGE_TAG:?required}
    restart: unless-stopped
    env_file:
      - /srv/infrastructure/secrets/static/openwebui.env
      - /srv/infrastructure/secrets/runtime/openwebui.env
    expose: ['8080']
    volumes:
      - "${OPENWEBUI_DATA_PATH:?required}:/app/backend/data"
    networks: [postgres, proxy]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  postgres: {external: true, name: "${OPENWEBUI_POSTGRES_NETWORK:?required}"}
  proxy: {external: true, name: "${OPENWEBUI_PROXY_NETWORK:?required}"}
