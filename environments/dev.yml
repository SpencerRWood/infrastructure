---
environment_name: dev
postgres_tls_enabled: true
# Events uses the canonical host database URL from the dev proxy network.
postgres_allowed_cidrs: ["192.168.1.0/24", "192.168.96.0/20"]
# Events Service runs its own migrations with its dedicated application role.
# The protected deployment input caches the canonical Infisical URL, never a
# separately generated password. No production application is selected here.
postgres_applications:
  - database: events_service
    role: events_service
    url_environment: WES_DATABASE_URL
    url_source: environment
    url_scheme: postgresql+psycopg
    host: 192.168.1.21
    port: 25433
  - database: architecture_docs
    role: architecture_docs
    url_environment: ARCHITECTURE_DOCS_DATABASE_URL
    url_source: infisical
    infisical_path: /architecture-docs
    url_scheme: postgresql
    host: 192.168.1.21
    port: 25433
caddy_bind_address: 192.168.1.21
caddy_http_port: 8080
caddy_https_port: 8443
caddy_allowed_cidrs:
  - 192.168.1.0/24
  # The edge Caddy container reaches this isolated listener over the host LAN
  # address, enabling normal HTTPS dev hostnames without joining Docker networks.
  - 172.27.0.0/16
dagster_restore_backup_path: /srv/infrastructure/backups/dagster/dagster-final.dump
keycloak_hostname: dev-keycloak.woodhost.cloud
# The complete image reference is intentionally kept on one line for auditing.
# yamllint disable rule:line-length
events_service_image_ref: ghcr.io/spencerrwood/events-service:v0.7.0@sha256:7c905f9a14d17a6f79cef9b58bbfd63dbe1c5aba765b4489e4c19c1599546f84
portfolio_website_image_ref: ghcr.io/spencerrwood/portfolio-website:v0.11.1@sha256:6751630cb2391fb881116debd7240f50fb584e95e1921ca29298cc2e91140706
wood_design_system_image_ref: ghcr.io/spencerrwood/wood-design-system:v0.1.0@sha256:af38221e4d96565fbfe586bc4de7bd83cc31fcb95d502f60d6adcc5513f3e97d
openproject_reports_image_ref: ghcr.io/spencerrwood/openproject-reports:v0.2.1@sha256:4589ccb8e74e56e59c3179f01e2bcd5ecf3b85124aff714135fb36114070de10
rag_service_image_ref: ghcr.io/spencerrwood/rag-service:v0.7.2@sha256:c5048af0308c3470deb48952519d753194c4bd489794f2c2ee6acec5ea845d3d
# Candidate passed real Qwen health, readiness and 1024-dimensional output checks.
rag_embedding_image_ref: ghcr.io/spencerrwood/rag-embedding:v0.7.2@sha256:4147219fecc76103994ec7425444a906b9155e88de48a65136b63d1f881c82a4
automerge_repair_image_ref: ghcr.io/spencerrwood/automerge-repair:v0.2.1@sha256:baa602f0b4dc72d26a6152f9777d536b12e96cf1b292786b7ad22888844c925e
# yamllint enable rule:line-length
# Independently published provider; rollout requires the scoped runtime secret
# and clean consumer clones described in docs/recovery-verification-runtime.md.
# yamllint disable rule:line-length
recovery_verification_image_ref: ghcr.io/spencerrwood/recovery-verification:v0.7.0@sha256:4e5c2ca87507e0e50f02fce3466222588eefb0539013b50d220f4f6cf8a09ab8
recovery_verification_config_source: "{{ playbook_dir }}/../../environments/recovery-verification-dev.json"
# yamllint enable rule:line-length
recovery_verification_notifications_enabled: true
recovery_verification_notification_start_time: '2026-10-13T16:36:54Z'
# Initial onboarding pins the published digest; deployment still requires approval.
services:
  wood_design_system: true
  backups: true
  recovery_verification: true
  overleaf: true
  automerge_repair: true
  events_service: true
  postgres: true
  caddy: true
  dagster: true
  openwebui: true
  keycloak: true
  infisical: true
  website_portfolio: true
  rag_service: true
  rudderstack: false

# Root-owned deployment metadata. Application containers never receive the
# machine-identity credential; only the resolver reads it.
infrastructure_infisical_runtime_services:
  automerge-repair:
    environment: dev
    path: /automerge-repair
    output: /srv/infrastructure/secrets/runtime/automerge-repair.env
    required_keys: [DAGSTER_POSTGRES_PASSWORD]
    compose_file: /srv/infrastructure/compose/automerge-repair/compose.yml
    compose_env_file: /srv/infrastructure/secrets/dev/automerge-repair-compose.env
    compose_services: [automerge-repair-code]
    source: compose/automerge-repair/compose.yml
  dagster:
    environment: dev
    path: /dagster
    output: /srv/infrastructure/secrets/runtime/dagster.env
    required_keys:
      - DAGSTER_POSTGRES_PASSWORD
      - OPENPROJECT_BASE_URL
      - OPENPROJECT_API_TOKEN
      - GOOGLE_DRIVE_CREDENTIALS_JSON
      - GOOGLE_DRIVE_FOLDER_ID
    compose_file: /srv/infrastructure/compose/dagster/compose.yml
    compose_env_file: /srv/infrastructure/secrets/dev/dagster-compose.env
    legacy_env_file: /srv/infrastructure/secrets/dev/dagster.env
    static_env_file: /srv/infrastructure/secrets/static/dagster.env
    compose_services:
      - dagster-user-code
      - dagster-codex-usage
      - openproject-reports-code
      - dagster-webserver
      - dagster-daemon
    source: compose/dagster/compose.infisical.yml
  keycloak:
    environment: dev
    path: /keycloak
    output: /srv/infrastructure/secrets/runtime/keycloak.env
    required_keys: [KC_DB_PASSWORD, KC_DB_URL, KEYCLOAK_ADMIN_PASSWORD]
    compose_file: /srv/infrastructure/compose/keycloak/compose.yml
    compose_env_file: /srv/infrastructure/secrets/dev/keycloak-compose.env
    legacy_env_file: /srv/infrastructure/secrets/dev/keycloak.env
    static_env_file: /srv/infrastructure/secrets/static/keycloak.env
    compose_services: [keycloak]
    source: compose/keycloak/compose.infisical.yml
  openwebui:
    environment: dev
    path: /openwebui
    output: /srv/infrastructure/secrets/runtime/openwebui.env
    required_keys: [DATABASE_URL, WEBUI_SECRET_KEY]
    compose_file: /srv/infrastructure/compose/openwebui/compose.yml
    compose_env_file: /srv/infrastructure/secrets/dev/openwebui-compose.env
    legacy_env_file: /srv/infrastructure/secrets/dev/openwebui.env
    static_env_file: /srv/infrastructure/secrets/static/openwebui.env
    compose_services: [openwebui]
    source: compose/openwebui/compose.infisical.yml
  portfolio-website:
    environment: dev
    path: /portfolio-website
    output: /srv/infrastructure/secrets/runtime/portfolio-website.env
    required_keys: [DATABASE_URL]
    compose_file: /srv/infrastructure/compose/website-portfolio/compose.yml
    compose_env_file: /srv/infrastructure/secrets/dev/website-portfolio-compose.env
    legacy_env_file: /srv/infrastructure/secrets/dev/website-portfolio.env
    static_env_file: /srv/infrastructure/secrets/static/portfolio-website.env
    compose_services: [website-portfolio]
    source: compose/website-portfolio/compose.infisical.yml

# Declarative backup targets; runtime JSON is compiled from this authority.
# Preserve the already-active rollout approved in docs/backup-key-recovery.md.
# Independent custody remains pending OP-543; this is the temporary exception,
# not a claim of independently recoverable custody. Role defaults stay closed.
backups_quiesce_authorized: "{{ backups_configuration.quiesce_authorized }}"
backups_temporary_operator_custody_authorized: >-
  {{ backups_configuration.temporary_operator_custody_authorized }}
backups_configuration:
  consumer: infrastructure
  environment: dev
  reader_gid: 10001
  status_file: /var/lib/infrastructure/backups/last-attempt.json
  deadline_seconds: 3600
  max_age_seconds: 86400
  destination:
    mount: /mnt/wood-server-nas/backup_server/swood-server/infrastructure-dev
    source: 192.168.1.10:/volume1/recovery_backups/infrastructure-dev
    fstype: nfs
    root: /mnt/wood-server-nas/backup_server/swood-server/infrastructure-dev
  postgres:
    password_source: file
    container: infrastructure-dev-postgres-postgres-1
    required_databases:
      - dagster
      - openwebui
      - keycloak
      - infisical
      - portfolio_website
      - synthetic_website_data
      - rag_service
      - events_service
      - architecture_docs
  quiesce_authorized: true
  quiesce_containers:
    - infrastructure-dev-recovery-verification-recovery-verification-code-1
    - infrastructure-dev-automerge-repair-automerge-repair-code-1
    - infrastructure-dev-dagster-dagster-daemon-1
    - infrastructure-dev-dagster-dagster-webserver-1
    - infrastructure-dev-dagster-dagster-user-code-1
    - infrastructure-dev-dagster-dagster-codex-usage-1
    - infrastructure-dev-dagster-openproject-reports-code-1
    - infrastructure-dev-openwebui-openwebui-1
    - infrastructure-dev-keycloak-keycloak-1
    - infrastructure-dev-infisical-infisical-1
    - infrastructure-dev-website-portfolio-website-portfolio-1
    - infrastructure-dev-rag-service-rag-service-1
    - infrastructure-dev-rag-service-rag-service-code-1
    - infrastructure-dev-events-service-wood-broker-1
    - infrastructure-dev-events-service-wood-notify-1
    - infrastructure-dev-overleaf-overleaf-1
    - infrastructure-dev-overleaf-clsi-1
    - infrastructure-dev-overleaf-clsi-gateway-1
  encryption_recipient: age1544rwqert2c0u5wks57lcgfw6saymcfmc7slhdr58js69w3m7d4st3la33
  independent_custody_verified: false
  temporary_operator_custody_authorized: true
  files:
    - id: dagster-state
      paths:
        - /srv/infrastructure/state/dagster/local
        - /srv/infrastructure/state/dagster/codex-usage
    - id: openwebui-files
      paths:
        - /srv/infrastructure/state/openwebui/data
    - id: rag-documents
      paths:
        - /srv/infrastructure/state/rag-service/documents
    - id: overleaf-files
      paths:
        - /srv/infrastructure/state/overleaf-dev/editor
    - id: infisical-recovery-keys
      sensitive: true
      paths:
        - /srv/infrastructure/bootstrap/infisical/infisical.env
  mongo:
    - id: overleaf-mongo
      container: infrastructure-dev-overleaf-mongo-1
  redis:
    - id: infisical-redis
      container: infrastructure-dev-infisical-redis-1
    - id: overleaf-redis
      container: infrastructure-dev-overleaf-redis-1
  schema_version: 1
  recovery_group: infrastructure-daily-consistent
  retention:
    pruning_enabled: false
    daily: 14
    weekly: 8
    monthly: 12
  recovery_prerequisites:
    - compatible PostgreSQL engine, extensions and source locales
    - isolated disposable restore storage
    - independently recoverable application secret references
    - independently stored age identity for Infisical bootstrap keys
  schedule:
    kind: cron
    reference: /var/spool/cron/crontabs/root
    user: root
    hour: '2'
    minute: '45'
