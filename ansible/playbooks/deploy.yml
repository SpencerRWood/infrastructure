---
- name: Configure an explicitly selected infrastructure environment
  hosts: infrastructure_hosts
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../environments/{{ infrastructure_environment }}.yml"
  pre_tasks:
    - name: Require a known environment manifest
      ansible.builtin.assert:
        that:
          - infrastructure_environment in ['dev', 'prod']
          - environment_name == infrastructure_environment
        fail_msg: Environment manifest and selected target must agree.
      tags: [always]
  roles:
    - role: host
    # The always-on Beelink runner is a development control-plane component.
    # Production hosts must not acquire its runner identity or credentials.
    - role: github_runner
      when: infrastructure_environment == 'dev'
  tasks:
    - name: Deploy selected PostgreSQL component
      ansible.builtin.include_role:
        name: postgres
      when: services.postgres | bool
      tags: [postgres]

    - name: Deploy selected Caddy component
      ansible.builtin.include_role:
        name: caddy
      when: services.caddy | bool
      tags: [caddy]

    - name: Deploy selected Dagster component
      ansible.builtin.include_role:
        name: dagster
      when: services.dagster | bool
      tags: [dagster]

    - name: Deploy selected Open WebUI component
      ansible.builtin.include_role:
        name: openwebui
      when: services.openwebui | bool
      tags: [openwebui]

    - name: Deploy selected Keycloak component
      ansible.builtin.include_role:
        name: keycloak
      when: services.keycloak | bool
      tags: [keycloak]

    - name: Deploy selected Infisical component
      ansible.builtin.include_role:
        name: infisical
      when: services.infisical | bool
      tags: [infisical]

    - name: Deploy selected Website Portfolio component
      ansible.builtin.include_role:
        name: website_portfolio
      when: services.website_portfolio | default(false) | bool
      tags: [website_portfolio]
