---
postgres_compose_root: /srv/infrastructure/compose/postgres
postgres_env_file: /srv/infrastructure/secrets/postgres.env
postgres_data_path: "{{ lookup('ansible.builtin.env', 'POSTGRES_DATA_PATH') }}"
postgres_expected_major: "16"
postgres_required_environment:
  - POSTGRES_DB
  - POSTGRES_USER
  - POSTGRES_PASSWORD_FILE
  - POSTGRES_DATA_PATH
  - POSTGRES_INIT_PATH
  - POSTGRES_INTERNAL_NETWORK
  - POSTGRES_LAN_NETWORK
  - POSTGRES_BIND_ADDRESS
  - POSTGRES_PORT
