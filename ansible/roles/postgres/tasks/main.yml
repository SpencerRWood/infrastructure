---
- name: Require the locally loaded PostgreSQL secret contract
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', item) | length > 0
    fail_msg: "{{ item }} must be set by the selected local environment file."
  loop: "{{ postgres_required_environment }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  tags: [postgres]

- name: Create PostgreSQL component directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ postgres_compose_directory }}"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ postgres_state_directory }}"
      owner: "{{ postgres_uid }}"
      group: "{{ postgres_gid }}"
      mode: '0700'
  tags: [postgres]

- name: Deploy protected PostgreSQL Compose environment
  ansible.builtin.copy:
    content: |-
      POSTGRES_DB={{ lookup('ansible.builtin.env', 'POSTGRES_DB') }}
      POSTGRES_USER={{ lookup('ansible.builtin.env', 'POSTGRES_USER') }}
      POSTGRES_PASSWORD_FILE={{ postgres_password_file }}
      POSTGRES_DATA_PATH={{ postgres_state_directory }}
      POSTGRES_NETWORK={{ postgres_network }}
      POSTGRES_LAN_NETWORK={{ postgres_lan_network }}
      POSTGRES_PROJECT_NAME={{ postgres_project_name }}
      POSTGRES_LAN_BIND={{ postgres_lan_bind }}
      POSTGRES_LAN_PORT={{ postgres_lan_port }}
    dest: "{{ postgres_env_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: [postgres]

- name: Allow infrastructure PostgreSQL from trusted LAN networks
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ item }}"
    port: "{{ postgres_lan_port }}"
  loop: "{{ postgres_allowed_cidrs }}"
  when: postgres_allowed_cidrs | length > 0
  tags: [postgres]

- name: Deploy protected PostgreSQL password file
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', 'POSTGRES_PASSWORD') }}\n"
    dest: "{{ postgres_password_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: [postgres]

- name: Deploy canonical PostgreSQL Compose payload
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../compose/postgres/compose.yml"
    dest: "{{ postgres_compose_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0644'
  tags: [postgres]

- name: Validate PostgreSQL storage ownership and permissions
  ansible.builtin.stat:
    path: "{{ postgres_state_directory }}"
  register: postgres_storage
  changed_when: false
  tags: [postgres]

- name: Require PostgreSQL storage ownership and permissions
  ansible.builtin.assert:
    that:
      - postgres_storage.stat.uid == (postgres_uid | int)
      - postgres_storage.stat.gid == (postgres_gid | int)
      - postgres_storage.stat.mode == '0700'
    fail_msg: PostgreSQL state must be owned by the container UID/GID with mode 0700.
  when: not ansible_check_mode
  tags: [postgres]

- name: Validate rendered PostgreSQL Compose configuration
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ postgres_env_file }}
      -f {{ postgres_compose_directory }}/compose.yml config --quiet
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode
  tags: [postgres]

- name: Start selected PostgreSQL service
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ postgres_env_file }}
      -f {{ postgres_compose_directory }}/compose.yml up -d postgres
  register: postgres_compose_up
  changed_when: postgres_compose_up.stdout is search('Created|Started|Recreated')
  when: not ansible_check_mode
  tags: [postgres]
