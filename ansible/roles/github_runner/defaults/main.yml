---
github_runner_name: github-runner-infrastructure
github_runner_user: github-runner-infrastructure
github_runner_group: github-runner-infrastructure
github_runner_root: "/opt/{{ github_runner_name }}"
github_runner_version: 2.337.0
github_runner_labels: beelink,infrastructure
github_runner_repository: SpencerRWood/infrastructure
github_runner_registration_token: "{{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_INFRASTRUCTURE_TOKEN') }}"
github_runner_removal_token: "{{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_INFRASTRUCTURE_REMOVAL_TOKEN') }}"
# Reconfiguration deliberately requires an explicit operator opt-in: stopping a
# runner that is executing a deployment is unsafe.
github_runner_reconfigure: false
github_runner_label_contract_file: "/etc/github-actions-runners/{{ github_runner_name }}.labels"
# This is a protected runner-local control-node input.  It is intentionally
# separate from the root-owned per-component environment files Ansible writes.
github_runner_secret_source: /home/spencerwood/.config/wood/infrastructure/dev.env
github_runner_secret_file: "/home/{{ github_runner_user }}/.secrets/dev.env"
github_runner_deployment_state_root: /var/lib/github-actions-deployments
github_runner_deployment_state_dir: "/var/lib/github-actions-deployments/{{ github_runner_name }}"
github_runner_deployment_wrapper: "/usr/local/sbin/{{ github_runner_name }}-deploy"
github_runner_inventory_path: ansible/inventory/dev
github_runner_playbook_path: ansible/playbooks/dev.yml
github_runner_health_command: bash scripts/health-check-dev.sh
github_runner_ansible_extra_args: ''
