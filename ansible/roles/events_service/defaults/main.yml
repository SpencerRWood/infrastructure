---
events_service_compose_directory: "{{ host_infrastructure_compose_root }}/events-service"
events_service_compose_env_file: "{{ host_infrastructure_secrets_root }}/events-service-compose.env"
events_service_project_name: "infrastructure-{{ infrastructure_environment }}-events-service"
events_service_postgres_network: "infrastructure-{{ infrastructure_environment }}-postgres"
events_service_proxy_network: "infrastructure-{{ infrastructure_environment }}-proxy"
events_service_broker_env_file: /srv/infrastructure/secrets/runtime/events-service-broker.env
events_service_notify_env_file: /srv/infrastructure/secrets/runtime/events-service-notify.env
events_service_infisical_path: /events-service
# Optional providers are enabled deliberately, including every required key.
events_service_optional_provider_keys: []
events_service_broker_keys: [WES_DATABASE_URL, WES_PRODUCER_CREDENTIALS, WES_SUBSCRIPTIONS]
events_service_notify_keys:
  - WES_DATABASE_URL
  - WES_PRODUCER_CREDENTIALS
  - WES_NOTIFICATION_POLICIES
  - TELEGRAM_BOT_TOKEN
  - TELEGRAM_CHAT_ID
  - TELEGRAM_WEBHOOK_SECRET
