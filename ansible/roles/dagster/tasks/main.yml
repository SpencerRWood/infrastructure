---
- name: Require the local Dagster secret contract
  ansible.builtin.assert:
    that: "lookup('ansible.builtin.env', item) | length > 0"
    fail_msg: "{{ item }} must be set by the selected local environment file."
  loop: "{{ dagster_required_environment }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: infrastructure_environment != 'dev'
  tags: [dagster]

- name: Validate external Dagster code-location declarations
  ansible.builtin.assert:
    that:
      - dagster_code_locations | valid_dagster_locations(dagster_runtime_environments)
    fail_msg: Invalid external Dagster code-location declaration.
  tags: [dagster]

- name: Create Dagster component directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ dagster_compose_directory }}", mode: '0755'}
    - {path: "{{ dagster_config_directory }}", mode: '0755'}
    - {path: "{{ dagster_app_directory }}", mode: '0755'}
    - {path: "{{ dagster_state_directory }}", mode: '0700'}
    - {path: "{{ dagster_local_directory }}", mode: '0770'}
  tags: [dagster]

- name: Permit the Codex code server to write Dagster local artifacts
  ansible.builtin.file:
    path: "{{ dagster_local_directory }}"
    state: directory
    owner: spencerwood
    group: spencerwood
    mode: '0770'
  tags: [dagster]

- name: Permit the Codex code server to access existing Dagster compute logs
  ansible.builtin.file:
    path: "{{ dagster_local_directory }}"
    state: directory
    owner: spencerwood
    group: spencerwood
    recurse: true
  tags: [dagster]

- name: Create persistent Codex slot claim directory
  ansible.builtin.file:
    path: "{{ dagster_codex_state_directory }}"
    state: directory
    owner: spencerwood
    group: spencerwood
    mode: '0700'
  tags: [dagster]

- name: Deploy protected Dagster runtime environment
  ansible.builtin.copy:
    content: |-
      DAGSTER_HOME=/opt/dagster/dagster_home
      DAGSTER_POSTGRES_HOST=postgres
      DAGSTER_POSTGRES_PORT=5432
      DAGSTER_POSTGRES_DB=dagster
      DAGSTER_POSTGRES_USER=dagster
      DAGSTER_POSTGRES_PASSWORD={{ lookup('ansible.builtin.env', 'DAGSTER_POSTGRES_PASSWORD') }}
      MACBOOK_DAGSTER_HOST={{ lookup('ansible.builtin.env', 'MACBOOK_DAGSTER_HOST') }}
    dest: "{{ dagster_env_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: infrastructure_environment != 'dev'
  tags: [dagster]

- name: Install current Dagster Infisical reconciliation tools
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - {src: resolve-infisical-env.py, dest: resolve-infrastructure-infisical-env}
    - {src: deploy-infrastructure-infisical-service, dest: deploy-infrastructure-infisical-service}
    - {src: dagster_external_locations.py, dest: dagster_external_locations.py}
    - {src: retire-dagster-external-locations, dest: retire-dagster-external-locations}
    - {src: rollback-infrastructure-infisical-service, dest: rollback-infrastructure-infisical-service}
  when: infrastructure_environment == 'dev'
  tags: [dagster]

- name: Resolve Dagster Infisical runtime before Compose
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/resolve-infrastructure-infisical-env
      - --environment
      - dev
      - --path
      - /dagster
      - --output
      - /srv/infrastructure/secrets/runtime/dagster.env
      - --require
      - DAGSTER_POSTGRES_PASSWORD
  changed_when: false
  no_log: true
  when: infrastructure_environment == 'dev' and not ansible_check_mode
  tags: [dagster]

- name: Resolve application runtime environments before Compose
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/sbin/resolve-infrastructure-infisical-env',
          '--environment', item.value.environment,
          '--path', item.value.path,
          '--output', item.value.output] +
          (item.value.required_keys | map('regex_replace', '^', '--require=') | list) }}
  loop: >-
    {{ dagster_runtime_environments |
       referenced_dagster_runtime_environments(dagster_code_locations) | dict2items }}
  changed_when: false
  no_log: true
  when: infrastructure_environment == 'dev' and not ansible_check_mode
  tags: [dagster]

- name: Check for retained Dagster rollback snapshot
  ansible.builtin.stat:
    path: "{{ dagster_compose_directory }}/compose.pre-infisical.yml"
  register: dagster_rollback_snapshot
  when: infrastructure_environment == 'dev'
  tags: [dagster]

- name: Check for retained Dagster rollback environment
  ansible.builtin.stat:
    path: "{{ dagster_compose_directory }}/compose.pre-infisical.env"
  register: dagster_rollback_environment
  when: infrastructure_environment == 'dev'
  tags: [dagster]

- name: Retain Compose interpolation values for Dagster rollback
  ansible.builtin.copy:
    src: "{{ dagster_compose_env_file }}"
    dest: "{{ dagster_compose_directory }}/compose.pre-infisical.env"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when:
    - infrastructure_environment == 'dev'
    - dagster_rollback_snapshot.stat.exists
    - not dagster_rollback_environment.stat.exists
  no_log: true
  tags: [dagster]

- name: Retain external Dagster rollback target metadata
  ansible.builtin.include_tasks: retain_rollback_locations.yml
  vars:
    dagster_rollback_directory: "{{ dagster_compose_directory }}"
    dagster_rollback_source_root: "{{ role_path }}/../../.."
  when: infrastructure_environment == 'dev' and dagster_rollback_snapshot.stat.exists
  tags: [dagster]

- name: Check for current external Dagster ownership metadata
  ansible.builtin.stat:
    path: /etc/infrastructure/dagster-external-locations.json
  register: dagster_external_ownership
  when: infrastructure_environment == 'dev'
  tags: [dagster]

- name: Bootstrap external Dagster ownership before first Compose rewrite
  ansible.builtin.copy:
    content: "{{ dagster_code_locations | to_nice_json }}\n"
    dest: /etc/infrastructure/dagster-external-locations.json
    owner: root
    group: root
    mode: '0644'
  when:
    - infrastructure_environment == 'dev'
    - not dagster_external_ownership.stat.exists
  tags: [dagster]

- name: Deploy Dagster Compose environment
  ansible.builtin.copy:
    content: |-
      DAGSTER_PROJECT_NAME={{ dagster_project_name }}
      DAGSTER_IMAGE={{ dagster_image }}
      DAGSTER_VERSION={{ dagster_version }}
      DAGSTER_LIB_VERSION={{ dagster_lib_version }}
      PYTHON_VERSION={{ dagster_python_version }}
      DAGSTER_RUNTIME_ENV_FILE={{ dagster_env_file }}
      DAGSTER_CONFIG_PATH={{ dagster_config_directory }}
      DAGSTER_LOCAL_PATH={{ dagster_local_directory }}
      DAGSTER_CODEX_HOME={{ dagster_codex_host_home }}
      DAGSTER_CODEX_STATE_PATH={{ dagster_codex_state_directory }}
      DAGSTER_POSTGRES_NETWORK={{ dagster_postgres_network }}
      DAGSTER_PROXY_NETWORK={{ dagster_proxy_network }}
    dest: "{{ dagster_compose_env_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: [dagster]

- name: Deploy canonical Dagster payload
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../compose/dagster/{{ item }}"
    dest: "{{ dagster_compose_directory }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [Dockerfile, compose.yml]
  when: item != 'compose.yml' or infrastructure_environment != 'dev'
  tags: [dagster]

- name: Render external Dagster services into the dev Compose payload
  ansible.builtin.template:
    src: compose.infisical.yml.j2
    dest: "{{ dagster_compose_directory }}/compose.yml"
    owner: root
    group: root
    mode: '0644'
  when: infrastructure_environment == 'dev'
  tags: [dagster]

- name: Deploy Dagster configuration and application
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../compose/dagster/{{ item.source }}/"
    dest: "{{ item.destination }}/"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {source: app, destination: "{{ dagster_app_directory }}"}
  tags: [dagster]

- name: Deploy Dagster storage configuration
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../compose/dagster/config/dagster.yaml"
    dest: "{{ dagster_config_directory }}/dagster.yaml"
    owner: root
    group: root
    mode: '0644'
  tags: [dagster]

- name: Render the Dagster workspace from code-location declarations
  ansible.builtin.template:
    src: workspace.yaml.j2
    dest: "{{ dagster_config_directory }}/workspace.yaml"
    owner: root
    group: root
    mode: '0644'
  tags: [dagster]

- name: Create infrastructure health metadata directory
  ansible.builtin.file:
    path: /etc/infrastructure
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: infrastructure_environment == 'dev'
  tags: [dagster]

- name: Check for the Dagster database role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ dagster_postgres_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -At
      - "--command=SELECT 1 FROM pg_roles WHERE rolname = 'dagster';"
  register: dagster_role
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [dagster]

- name: Create the non-superuser Dagster database role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ dagster_postgres_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - --set=ON_ERROR_STOP=1
      - >-
        --command=CREATE ROLE dagster LOGIN NOSUPERUSER NOCREATEDB
        NOCREATEROLE NOINHERIT PASSWORD
        '{{ lookup('ansible.builtin.env', 'DAGSTER_POSTGRES_PASSWORD') | replace("'", "''") }}';
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - dagster_role.stdout | trim != '1'
    - infrastructure_environment != 'dev'
  tags: [dagster]

- name: Require existing Dagster role in Infisical-managed dev
  ansible.builtin.assert:
    that: dagster_role.stdout | trim == '1'
  when:
    - infrastructure_environment == 'dev'
    - not ansible_check_mode
  tags: [dagster]

- name: Check for the target Dagster database
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ dagster_postgres_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -At
      - "--command=SELECT 1 FROM pg_database WHERE datname = 'dagster';"
  register: dagster_database
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [dagster]

- name: Create the target Dagster database
  ansible.builtin.command:
    argv: [docker, exec, "{{ dagster_postgres_container }}", createdb, -U, postgres, -O, dagster, dagster]
  changed_when: true
  when:
    - not ansible_check_mode
    - dagster_database.stdout | trim != '1'
  tags: [dagster]

- name: Check for completed Dagster database restore
  ansible.builtin.stat:
    path: "{{ dagster_restore_marker }}"
  register: dagster_restore
  changed_when: false
  tags: [dagster]

- name: Require final Dagster backup before first startup
  ansible.builtin.stat:
    path: "{{ dagster_restore_backup_path }}"
  register: dagster_backup
  changed_when: false
  when:
    - not ansible_check_mode
    - not dagster_restore.stat.exists
  tags: [dagster]

- name: Assert final Dagster backup exists
  ansible.builtin.assert:
    that: dagster_backup.stat.exists
    fail_msg: Dagster startup is blocked until the final source backup exists.
  when:
    - not ansible_check_mode
    - not dagster_restore.stat.exists
  tags: [dagster]

- name: Copy final Dagster backup into target Postgres
  ansible.builtin.command:
    argv: [docker, cp, "{{ dagster_restore_backup_path }}", "{{ dagster_postgres_container }}:/tmp/dagster-final.dump"]
  changed_when: true
  when:
    - not ansible_check_mode
    - not dagster_restore.stat.exists
  tags: [dagster]

- name: Restore final Dagster backup once
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ dagster_postgres_container }}"
      - pg_restore
      - -U
      - postgres
      - -d
      - dagster
      - --exit-on-error
      - /tmp/dagster-final.dump
  changed_when: true
  when:
    - not ansible_check_mode
    - not dagster_restore.stat.exists
  tags: [dagster]

- name: Record completed Dagster restore
  ansible.builtin.copy:
    content: "{{ dagster_restore_backup_path }}\n"
    dest: "{{ dagster_restore_marker }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - not ansible_check_mode
    - not dagster_restore.stat.exists
  tags: [dagster]

- name: Validate rendered Dagster Compose configuration
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ dagster_compose_env_file }}
      -f {{ dagster_compose_directory }}/compose.yml config --quiet
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode
  tags: [dagster]

- name: Start selected Dagster services after attended database restore
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ dagster_compose_env_file }}
      -f {{ dagster_compose_directory }}/compose.yml up -d --build
  register: dagster_up
  changed_when: dagster_up.stdout is search('Created|Started|Recreated|Built')
  when: not ansible_check_mode
  tags: [dagster]

- name: Retire obsolete external Dagster code servers
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/sbin/retire-dagster-external-locations',
          '--desired-json', dagster_code_locations | to_json,
          '--desired-compose-services-json',
          infrastructure_infisical_runtime_services.dagster.compose_services | to_json] }}
  changed_when: false
  when: infrastructure_environment == 'dev' and not ansible_check_mode
  tags: [dagster]

- name: Publish current Dagster Infisical reconciliation metadata
  ansible.builtin.copy:
    content: "{{ infrastructure_infisical_runtime_services | to_nice_json }}\n"
    dest: /etc/infrastructure/infisical-runtime-services.json
    owner: root
    group: root
    mode: '0644'
  when: infrastructure_environment == 'dev' and not ansible_check_mode
  tags: [dagster]

- name: Publish current external Dagster ownership metadata
  ansible.builtin.copy:
    content: "{{ dagster_code_locations | to_nice_json }}\n"
    dest: /etc/infrastructure/dagster-external-locations.json
    owner: root
    group: root
    mode: '0644'
  when: infrastructure_environment == 'dev' and not ansible_check_mode
  tags: [dagster]

- name: Publish external Dagster code locations for the remote health gate
  ansible.builtin.copy:
    content: "{{ dagster_code_locations | map(attribute='service_name') | list | to_nice_json }}\n"
    dest: /etc/infrastructure/dagster-code-locations.json
    owner: root
    group: root
    mode: '0644'
  when: infrastructure_environment == 'dev' and not ansible_check_mode
  tags: [dagster]
